name: Mobile app checks

on:
  push:
    branches:
      - feature/offline-face-object-detection
    paths:
      - .github/workflows/mobile-typecheck.yml
      - app/**
      - lib/**
      - package.json
      - package-lock.json
      - app.json
      - tsconfig.json
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
